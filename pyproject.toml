[project]
name = "fde-trading-desk-bot"
version = "0.2.0"
description = "Motor LLM base de la mesa de trading (Coderhouse FDE, PE2)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",
    "openai>=3.41,<4",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "alpaca-py>=0.44,<0.45",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# alpaca-py importa websockets.legacy: el aviso es de la dependencia, no del bot
filterwarnings = ["ignore::DeprecationWarning:websockets.legacy"]
