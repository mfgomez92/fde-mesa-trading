[project]
name = "fde-mesa-trading"
version = "0.3.0"
description = "Mesa de trading con LLM (Coderhouse FDE): versión del curso, PE2 a PE3"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",
    "openai>=3.41,<4",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "alpaca-py>=0.44,<0.45",
    "tzdata>=2026.1",
    "chromadb>=1.5,<2",
    "rank-bm25>=0.2.2,<0.3",
    "fastembed>=0.9,<0.10",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["solo_full: necesita el corpus real de la mesa (no se publica en el repo del curso)"]
filterwarnings = ["ignore::DeprecationWarning:websockets.legacy"]
